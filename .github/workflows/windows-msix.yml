# SPDX-License-Identifier: MPL-2.0
#
# Builds XR Pilot with the OXRSys runtime and driver under MSVC and pixi's Vulkan loader, then packs
# and test-signs one MSIX and checks its contents.
name: windows-msix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  msix:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          cache: true
      - name: Build
        shell: pwsh
        # No Vulkan SDK on the runner; FindVulkan takes pixi's headers and loader instead.
        run: |
          $env:VULKAN_SDK = "$PWD\.pixi\envs\default\Library"
          scripts/windows_build.ps1 -BuildType Release
      - name: Runtime, driver and pilot tests
        shell: pwsh
        run: |
          pixi run ctest --test-dir build/windows --output-on-failure -E '^(oxrsys_pyrowave_tests|oxrsys_runtime_d3d11_tests)$'
          if ($LASTEXITCODE) { exit 1 }
      - name: PyroWave round trip, unchecked without a GPU
        run: echo "UNCHECKED 1 - oxrsys_pyrowave_tests needs a Vulkan GPU, which this runner lacks; it runs on the Windows desk"
      - name: D3D11 loader test, unchecked when elevated
        run: echo "UNCHECKED 1 - oxrsys_runtime_d3d11_tests selects the runtime through XR_RUNTIME_JSON, which the OpenXR loader ignores in this runner's elevated context; it runs on the Windows desk"
      - name: Pack and test-sign the MSIX
        shell: pwsh
        run: scripts/windows_package_msix.ps1 -OutDir dist
      - name: Check the MSIX
        shell: pwsh
        run: Get-ChildItem dist/*.msix | ForEach-Object { scripts/windows_check_msix.ps1 $_.FullName; if ($LASTEXITCODE) { exit 1 } }
      - name: Check control, a package without the runtime fails
        shell: pwsh
        run: |
          $msix = (Get-ChildItem dist/*.msix)[0].FullName
          Copy-Item $msix control.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::Open((Resolve-Path control.zip), 'Update')
          $zip.GetEntry('runtime/liboxrsys-runtime.dll').Delete()
          $zip.Dispose()
          scripts/windows_check_msix.ps1 control.zip
          if ($LASTEXITCODE -eq 0) { Write-Host "control passed but must fail"; exit 1 }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: xr-pilot-windows-msix
          path: |
            dist/*.msix
            dist/*.cer
