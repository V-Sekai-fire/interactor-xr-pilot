# SPDX-License-Identifier: MPL-2.0
#
# Builds the Android headset client's debug APK, attached to the release on a version tag.
name: android

on:
  workflow_call:
    inputs:
      run:
        description: Build this platform. When false its jobs report as skipped.
        type: boolean
        default: true

jobs:
  apk:
    if: ${{ inputs.run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: oxrsys/clients/Android/android-vr
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build
        run: ./gradlew --no-daemon assembleDebug
      - name: Headset run, unchecked
        run: echo "UNCHECKED 1 - the APK is built, not run; nothing here exercises it on a headset"
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "oxrsys-android-$GITHUB_REF_NAME-debug.apk"
          gh release upload "$GITHUB_REF_NAME" "oxrsys-android-$GITHUB_REF_NAME-debug.apk" --clobber
