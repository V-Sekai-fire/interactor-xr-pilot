# SPDX-License-Identifier: MPL-2.0
#
# Builds XR Pilot with the OXRSys runtime and driver under MSVC and pixi's Vulkan loader, packs one
# per-user MSI with CPack and WiX v4, and installs, checks and uninstalls it without elevation,
# attached to the release on a version tag.
name: windows-msi

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  msi:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          cache: true
      - name: Build
        shell: pwsh
        # No Vulkan SDK on the runner; FindVulkan takes pixi's headers and loader instead.
        run: |
          $env:VULKAN_SDK = "$PWD\.pixi\envs\default\Library"
          scripts/windows_build.ps1 -BuildType Release
      - name: Runtime, driver and pilot tests
        shell: pwsh
        run: |
          pixi run ctest --test-dir build/windows --output-on-failure -E '^(oxrsys_pyrowave_tests|oxrsys_runtime_d3d11_tests)$'
          if ($LASTEXITCODE) { exit 1 }
      - name: PyroWave round trip, unchecked without a GPU
        run: echo "UNCHECKED 1 - oxrsys_pyrowave_tests needs a Vulkan GPU, which this runner lacks; it runs on the Windows desk"
      - name: D3D11 loader test, unchecked when elevated
        run: echo "UNCHECKED 1 - oxrsys_runtime_d3d11_tests selects the runtime through XR_RUNTIME_JSON, which the OpenXR loader ignores in this runner's elevated context; it runs on the Windows desk"
      - name: WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g WixToolset.UI.wixext/4.0.6
          if ($LASTEXITCODE) { exit 1 }
      - name: Pack the MSI
        shell: pwsh
        working-directory: build/windows
        run: |
          pixi run cpack -G WIX -C Release -B ../../dist
          if ($LASTEXITCODE) { exit 1 }
      - name: Check control, an empty folder fails
        shell: pwsh
        run: scripts/windows_check_msi.ps1 -SelfTest
      - name: Install per-user, check and uninstall the MSI
        shell: pwsh
        run: Get-ChildItem dist/*.msi | ForEach-Object { scripts/windows_check_msi.ps1 $_.FullName; if ($LASTEXITCODE) { exit 1 } }
      - name: Per-user install unelevated, unchecked
        run: echo "UNCHECKED 1 - this runner's shell is elevated, so the install proves the per-user scope but not the absence of a UAC prompt; that runs on the Windows desk"
      - uses: actions/upload-artifact@v4
        with:
          name: xr-pilot-windows-msi
          path: dist/*.msi
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.msi --clobber
