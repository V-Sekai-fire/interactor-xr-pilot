# SPDX-License-Identifier: MPL-2.0
#
# Builds the macOS runtime and runs its tests, builds and tests the Apple Swift packages,
# and builds the Apple client apps unsigned into a disk image, attached to the release on a
# version tag. Platforms the runner cannot build are echoed as UNCHECKED rather than dropped.
name: macos

on:
  workflow_call:
    inputs:
      run:
        description: Build this platform. When false its jobs report as skipped.
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  runtime:
    if: ${{ inputs.run }}
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: oxrsys
    steps:
      - uses: actions/checkout@v5
      - name: Metal device
        id: metal
        run: |
          sw_vers
          xcodebuild -version
          cat > "$RUNNER_TEMP/metal_probe.swift" <<'EOF'
          import Metal
          let device = MTLCreateSystemDefaultDevice()
          print("Metal device: \(device?.name ?? "none")")
          print("apple7=\(device?.supportsFamily(.apple7) == true ? "yes" : "no")")
          EOF
          swift "$RUNNER_TEMP/metal_probe.swift" | tee "$RUNNER_TEMP/metal_probe.txt"
          grep '^apple7=' "$RUNNER_TEMP/metal_probe.txt" >> "$GITHUB_OUTPUT"
      - name: Toolchain
        run: brew install ninja vulkan-headers vulkan-loader
      - name: Configure
        run: cmake --preset macos-arm64
      - name: Build
        run: cmake --build build/macos-arm64
      - name: Test
        if: steps.metal.outputs.apple7 == 'yes'
        run: ctest --test-dir build/macos-arm64 --output-on-failure
      - name: Test, PyroWave round trip unchecked without an Apple7 GPU
        if: steps.metal.outputs.apple7 != 'yes'
        run: |
          echo "UNCHECKED 1 - oxrsys_pyrowave_tests needs a Metal device in GPU family Apple7, which PyroWave requires and this runner's device does not report"
          ctest --test-dir build/macos-arm64 --output-on-failure -E '^oxrsys_pyrowave_tests$'

  swift-packages:
    needs: runtime
    if: ${{ !cancelled() && inputs.run }}
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: oxrsys/clients/Apple/common
    steps:
      - uses: actions/checkout@v5
      - name: OXRSysStreaming
        run: |
          swift build --package-path OXRSysStreaming
          swift test --package-path OXRSysStreaming
      - name: OXRSysSimulator
        run: swift build --package-path OXRSysSimulator
      - name: OXRSysSimulator test, unchecked without a test target
        run: echo "UNCHECKED 1 - OXRSysSimulator has no test target; it is built only"

  apps:
    needs: swift-packages
    if: ${{ !cancelled() && inputs.run }}
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: oxrsys
    steps:
      - uses: actions/checkout@v5
      - name: SDKs
        run: xcodebuild -showsdks
      - name: Home
        run: |
          xcodebuild -project "clients/Apple/oxrsys-home/OXRSys Home.xcodeproj" \
            -scheme "OXRSys Home" -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath build/xcode \
            CODE_SIGNING_ALLOWED=NO build
      - name: Simulator
        run: |
          xcodebuild -project "clients/Apple/oxrsys-simulator/OXRSys Simulator.xcodeproj" \
            -scheme "OXRSys Simulator" -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath build/xcode \
            CODE_SIGNING_ALLOWED=NO build
      - name: visionOS
        run: |
          if xcodebuild -showsdks | grep -q xrsimulator; then
            xcodebuild -project "clients/Apple/oxrsys-visionos/OXRSys visionOS.xcodeproj" \
              -scheme "OXRSys visionOS" -configuration Debug \
              -destination 'generic/platform=visionOS Simulator' \
              CODE_SIGNING_ALLOWED=NO build
          else
            echo "UNCHECKED 1 - the visionOS simulator SDK is not installed on this runner; OXRSys visionOS is not built"
          fi
      - name: Disk image
        run: |
          mkdir -p build/dmg dist
          cp -R build/xcode/Build/Products/Debug/*.app build/dmg/
          ls build/dmg
          hdiutil create -volname OXRSys -srcfolder build/dmg -format UDRO dist/oxrsys-macos-apps-unsigned.dmg
      - uses: actions/upload-artifact@v6
        with:
          name: oxrsys-macos-apps
          path: oxrsys/dist/*.dmg
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
