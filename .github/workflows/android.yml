# SPDX-License-Identifier: MPL-2.0
#
# Builds the Android headset client's debug APK, attached to the release on a version tag.
name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: oxrsys/clients/Android/android-vr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: ./gradlew --no-daemon assembleDebug
      - name: Headset run, unchecked
        run: echo "UNCHECKED 1 - the APK is built, not run; nothing here exercises it on a headset"
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "oxrsys-android-$GITHUB_REF_NAME-debug.apk"
          gh release upload "$GITHUB_REF_NAME" "oxrsys-android-$GITHUB_REF_NAME-debug.apk" --clobber
